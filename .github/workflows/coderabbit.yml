# The "AI Code Review" job was removed 2026-09-25: its action (coderabbitai/ai-pr-reviewer)
# was deleted from GitHub, so it failed on every run. CodeRabbit reviews via its GitHub app.
name: Secret Scanning

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs on new pushes to the same branch
concurrency:
  group: coderabbit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # No base/head: the action picks the pushed commits or the PR range itself.
          # Pinning base to main made every push to main compare main with itself and fail.
          extra_args: --debug --only-verified
